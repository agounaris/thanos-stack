# Minimal Grafana for the (non-multi-tenant) stack: one datasource pointing at
# query-frontend. For the multi-tenant variant (a datasource per tenant, Basic
# auth through the tenant-gateway) use examples/multi-tenancy/grafana.yaml.
#
#   kubectl apply -f examples/grafana.yaml
#   kubectl -n default port-forward svc/grafana 3000:3000        # http://localhost:3000
#   # or add "127.0.0.1 grafana.local" to /etc/hosts and open http://grafana.local
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: default
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Thanos
        type: prometheus
        access: proxy
        isDefault: true
        url: http://thanos-stack-query-frontend.default.svc.cluster.local:10902
        uid: thanos
        jsonData:
          httpMethod: POST
          prometheusType: Thanos
          timeInterval: 30s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: default
  labels: { app: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: "admin" }
            - { name: GF_USERS_DEFAULT_THEME, value: "light" }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: provisioning, configMap: { name: grafana-provisioning } }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: default
  labels: { app: grafana }
spec:
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: default
  labels: { app: grafana }
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: grafana, port: { number: 3000 } } }
