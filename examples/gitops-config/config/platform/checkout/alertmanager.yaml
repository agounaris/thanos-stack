# Owner: platform / checkout
# Alertmanager routing + receivers for this service only. The pipeline merges
# every service's fragment into one Alertmanager config (or renders one
# AlertmanagerConfig CR per service when using the Prometheus Operator).
#
# Convention: this fragment may only match on `team=platform, service=checkout`
# so teams cannot capture each other's alerts.
route:
  matchers:
    - team = "platform"
    - service = "checkout"
  receiver: platform-checkout
  group_by: [alertname, route]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers: [severity = "critical"]
      receiver: platform-checkout-pager

receivers:
  - name: platform-checkout
    slack_configs:
      - channel: "#platform-checkout-alerts"
        send_resolved: true
  - name: platform-checkout-pager
    pagerduty_configs:
      - service_key_file: /etc/alertmanager/secrets/platform-checkout-pd/key
