# Bootstrap: one Application that installs the ApplicationSet above.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thanos-stack-config-bootstrap
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: https://github.com/your-org/observability-config.git
    targetRevision: main
    path: examples/gitops-config/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
