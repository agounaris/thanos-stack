{{- $cfg := include "thanos-stack.cfg" . | fromYaml -}}
{{- $sg := $cfg.storeGateway -}}
{{- if $sg.enabled -}}
{{- $fn := include "thanos-stack.fullname" . -}}
{{- $root := . -}}
{{- $replicas := int ($sg.replicasPerShard | default 1) -}}
{{- range $shard := $sg.timeShards }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-storegateway-{{ $shard.name }}
  labels:
    {{- include "thanos-stack.labels" $root | nindent 4 }}
    app.kubernetes.io/component: storegateway
    thanos.io/store-shard: {{ $shard.name | quote }}
spec:
  replicas: {{ $replicas }}
  serviceName: {{ $fn }}-storegateway-{{ $shard.name }}-headless
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "thanos-stack.selectorLabels" (dict "ctx" $root "component" "storegateway") | nindent 6 }}
      thanos.io/store-shard: {{ $shard.name | quote }}
  template:
    metadata:
      labels:
        {{- include "thanos-stack.labels" $root | nindent 8 }}
        app.kubernetes.io/component: storegateway
        thanos.io/store-shard: {{ $shard.name | quote }}
      {{- with $root.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "thanos-stack.serviceAccountName" $root }}
      securityContext:
        {{- include "thanos-stack.podSecurityContext" $root | nindent 8 }}
      {{- include "thanos-stack.podHardening" (dict "ctx" $root "component" "storegateway" "terminationGracePeriodSeconds" 120) | nindent 6 }}
      containers:
        - name: store
          image: {{ include "thanos-stack.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            {{- include "thanos-stack.containerSecurityContext" $root | nindent 12 }}
          args:
            - store
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --data-dir=/var/thanos/store
            - --index-cache-size={{ $shard.indexCacheSize | default "250MB" }}
            - --chunk-pool-size={{ $shard.chunkPoolSize | default "1GB" }}
            {{- if $shard.minTime }}
            - --min-time={{ $shard.minTime }}
            {{- end }}
            {{- if $shard.maxTime }}
            - --max-time={{ $shard.maxTime }}
            {{- end }}
            - {{ include "thanos-stack.objstoreArg" $root }}
            {{- range $sg.extraArgs }}
            - {{ . }}
            {{- end }}
          {{- with $root.Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - { name: grpc, containerPort: 10901 }
            - { name: http, containerPort: 10902 }
          startupProbe:
            httpGet: { path: /-/ready, port: http }
            failureThreshold: 120
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 30
          {{- with $sg.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: /var/thanos/store }
            - { name: tmp, mountPath: /tmp }
            {{- include "thanos-stack.objstoreVolumeMount" $root | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "thanos-stack.objstoreVolume" $root | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $sg.persistence.storageClass }}
        storageClassName: {{ $sg.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ $sg.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-storegateway-{{ $shard.name }}-headless
  labels:
    {{- include "thanos-stack.labels" $root | nindent 4 }}
    app.kubernetes.io/component: storegateway
    thanos.io/store-shard: {{ $shard.name | quote }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "thanos-stack.selectorLabels" (dict "ctx" $root "component" "storegateway") | nindent 4 }}
    thanos.io/store-shard: {{ $shard.name | quote }}
  ports:
    - { name: grpc, port: 10901, targetPort: grpc }
    - { name: http, port: 10902, targetPort: http }
{{- if gt $replicas 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fn }}-storegateway-{{ $shard.name }}
  labels:
    {{- include "thanos-stack.labels" $root | nindent 4 }}
    app.kubernetes.io/component: storegateway
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "thanos-stack.selectorLabels" (dict "ctx" $root "component" "storegateway") | nindent 6 }}
      thanos.io/store-shard: {{ $shard.name | quote }}
{{- end }}
{{- end }}
{{- end }}
