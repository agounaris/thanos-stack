{{- if .Values.alloy.enabled }}
{{- $fn := include "thanos-stack.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fn }}-alloy
  labels:
    {{- include "thanos-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
# Alloy needs the API to do Kubernetes SD and proxy-scrape kubelet/cAdvisor.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fn }}-alloy
  labels:
    {{- include "thanos-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: [get, list, watch]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fn }}-alloy
  labels:
    {{- include "thanos-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fn }}-alloy
subjects:
  - kind: ServiceAccount
    name: {{ $fn }}-alloy
    namespace: {{ .Release.Namespace }}
{{- end }}
