{{- if .Values.alloy.enabled }}
{{- $cfg := include "thanos-stack.cfg" . | fromYaml }}
{{- $fn := include "thanos-stack.fullname" . }}
{{- $a := .Values.alloy }}
{{- $rwPort := $cfg.receive.service.remoteWritePort | default 19291 }}
{{- $labels := merge (deepCopy ($a.externalLabels | default dict)) (deepCopy (.Values.externalLabels | default dict)) }}
{{- $tls := "tls_config {\n  insecure_skip_verify = true\n}\nbearer_token_file = \"/var/run/secrets/kubernetes.io/serviceaccount/token\"" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-alloy
  labels:
    {{- include "thanos-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
data:
  config.alloy: |
    // ===================================================================
    // Generated by the thanos-stack Helm chart. Ships common Kubernetes
    // metrics into Thanos Receive. Edit via `alloy.*` values, not here.
    // ===================================================================

    logging {
      level  = "info"
      format = "logfmt"
    }

    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.kubernetes "services" {
      role = "service"
    }

    discovery.kubernetes "endpoints" {
      role = "endpoints"
    }

    prometheus.remote_write "thanos" {
      endpoint {
        url = "http://{{ $fn }}-receive.{{ .Release.Namespace }}.svc.cluster.local:{{ $rwPort }}/api/v1/receive"
        {{- if $a.tenant }}
        headers = { "{{ $.Values.multiTenancy.tenantHeader }}" = {{ $a.tenant | quote }} }
        {{- end }}
        queue_config {
          capacity             = 10000
          max_samples_per_send = 2000
        }
      }
      external_labels = {
        collector = "grafana-alloy",
        {{- range $k, $v := $labels }}
        {{ $k }} = {{ $v | quote }},
        {{- end }}
      }
    }
    {{- if $a.otlp.enabled }}
    {{- $split := $.Values.multiTenancy.splitTenantLabel }}

    // ---- OTLP metrics receiver -------------------------------------------
    otelcol.receiver.otlp "in" {
      grpc { endpoint = "0.0.0.0:{{ $a.otlp.grpcPort | default 4317 }}" }
      http { endpoint = "0.0.0.0:{{ $a.otlp.httpPort | default 4318 }}" }
      output { metrics = [otelcol.processor.transform.tenant.input] }
    }

    // resource attribute `{{ $a.otlp.tenantResourceAttribute }}` -> label `{{ $split }}`,
    // which Receive (--receive.split-tenant-label-name) uses to pick the tenant.
    otelcol.processor.transform "tenant" {
      error_mode = "ignore"
      metric_statements {
        context = "datapoint"
        statements = [
          "set(attributes[\"{{ $split }}\"], resource.attributes[\"{{ $a.otlp.tenantResourceAttribute }}\"]) where resource.attributes[\"{{ $a.otlp.tenantResourceAttribute }}\"] != nil",
          {{- range $a.otlp.extraStatements }}
          {{ . | quote }},
          {{- end }}
        ]
      }
      output { metrics = [otelcol.exporter.prometheus.otlp.input] }
    }

    otelcol.exporter.prometheus "otlp" {
      add_metric_suffixes = false
      forward_to = [prometheus.remote_write.thanos_otlp.receiver]
    }

    prometheus.remote_write "thanos_otlp" {
      endpoint {
        url = "http://{{ $fn }}-receive.{{ .Release.Namespace }}.svc.cluster.local:{{ $rwPort }}/api/v1/receive"
        {{- if $a.tenant }}
        // fallback tenant for OTLP metrics that carry no `{{ $a.otlp.tenantResourceAttribute }}` attribute
        headers = { "{{ $.Values.multiTenancy.tenantHeader }}" = {{ $a.tenant | quote }} }
        {{- end }}
      }
      external_labels = {
        collector = "grafana-alloy-otlp",
        {{- range $k, $v := $labels }}
        {{ $k }} = {{ $v | quote }},
        {{- end }}
      }
    }
    {{- end }}

    {{- if $a.scrape.kubelet }}

    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/${1}/proxy/metrics"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "kubelet" {
      job_name        = "kubelet"
      targets         = discovery.relabel.kubelet.output
      scheme          = "https"
      scrape_interval = {{ $a.scrape.interval | quote }}
      {{- include "thanos-stack.alloyScrapeLimits" $a | nindent 6 }}
      {{- $tls | nindent 6 }}
      forward_to = [prometheus.remote_write.thanos.receiver]
    }
    {{- end }}

    {{- if $a.scrape.cadvisor }}

    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/${1}/proxy/metrics/cadvisor"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "cadvisor" {
      job_name        = "cadvisor"
      targets         = discovery.relabel.cadvisor.output
      scheme          = "https"
      scrape_interval = {{ $a.scrape.interval | quote }}
      {{- include "thanos-stack.alloyScrapeLimits" $a | nindent 6 }}
      {{- $tls | nindent 6 }}
      forward_to = [prometheus.remote_write.thanos.receiver]
    }
    {{- end }}

    {{- if $a.scrape.apiserver }}

    discovery.relabel "apiserver" {
      targets = discovery.kubernetes.endpoints.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_service_name", "__meta_kubernetes_endpoint_port_name"]
        regex         = "default;kubernetes;https"
        action        = "keep"
      }
    }

    prometheus.scrape "apiserver" {
      job_name        = "kube-apiserver"
      targets         = discovery.relabel.apiserver.output
      scheme          = "https"
      scrape_interval = {{ $a.scrape.interval | quote }}
      {{- include "thanos-stack.alloyScrapeLimits" $a | nindent 6 }}
      {{- $tls | nindent 6 }}
      forward_to = [prometheus.remote_write.thanos.receiver]
    }
    {{- end }}

    {{- if $a.scrape.kubeStateMetrics }}

    discovery.relabel "kube_state_metrics" {
      targets = discovery.kubernetes.services.targets
      rule {
        source_labels = ["__meta_kubernetes_service_name"]
        regex         = "(kube-state-metrics|.*-kube-state-metrics)"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_port_name"]
        regex         = "(http|http-metrics|metrics|8080)"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
    }

    prometheus.scrape "kube_state_metrics" {
      job_name        = "kube-state-metrics"
      targets         = discovery.relabel.kube_state_metrics.output
      scrape_interval = {{ $a.scrape.interval | quote }}
      {{- include "thanos-stack.alloyScrapeLimits" $a | nindent 6 }}
      forward_to = [prometheus.remote_write.thanos.receiver]
    }
    {{- end }}

    {{- if $a.scrape.annotatedPods }}

    discovery.relabel "annotated_pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex         = "true"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Running"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
      }
      rule {
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        regex         = "([^:]+)(?::\\d+)?;(\\d+)"
        replacement   = "$1:$2"
        target_label  = "__address__"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "annotated_pods" {
      job_name        = "kubernetes-pods"
      targets         = discovery.relabel.annotated_pods.output
      scrape_interval = {{ $a.scrape.interval | quote }}
      {{- include "thanos-stack.alloyScrapeLimits" $a | nindent 6 }}
      forward_to = [prometheus.remote_write.thanos.receiver]
    }
    {{- end }}

    {{- if $a.scrape.thanosStack }}

    discovery.relabel "thanos_stack" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = {{ .Release.Namespace | quote }}
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of"]
        regex         = "thanos"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
        regex         = {{ .Release.Name | quote }}
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex         = "http"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        target_label  = "component"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "thanos_stack" {
      job_name        = "thanos-stack"
      targets         = discovery.relabel.thanos_stack.output
      scrape_interval = {{ $a.scrape.interval | quote }}
      {{- include "thanos-stack.alloyScrapeLimits" $a | nindent 6 }}
      forward_to = [prometheus.remote_write.thanos.receiver]
    }
    {{- end }}
    {{- with $a.extraConfig }}

    // ---- alloy.extraConfig ----
    {{ . | nindent 4 }}
    {{- end }}
{{- end }}
