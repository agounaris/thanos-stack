{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "thanos-stack.serviceAccountName" . }}
  labels:
    {{- include "thanos-stack.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if and (not .Values.objstore.existingSecret) .Values.objstore.config }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thanos-stack.objstoreSecretName" . }}
  labels:
    {{- include "thanos-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  objstore.yml: |
    {{- toYaml .Values.objstore.config | nindent 4 }}
{{- end }}
