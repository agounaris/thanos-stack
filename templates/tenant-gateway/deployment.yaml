{{- $mt := .Values.multiTenancy -}}
{{- if and $mt.enabled $mt.gateway.enabled -}}
{{- $fn := include "thanos-stack.fullname" . -}}
{{- $g := $mt.gateway -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-tenant-gateway
  labels:
    {{- include "thanos-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-gateway
spec:
  replicas: {{ $g.replicas | default 2 }}
  selector:
    matchLabels:
      {{- include "thanos-stack.selectorLabels" (dict "ctx" . "component" "tenant-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "thanos-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: tenant-gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/tenant-gateway/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "thanos-stack.serviceAccountName" . }}
      securityContext:
        {{- include "thanos-stack.podSecurityContext" . | nindent 8 }}
      {{- include "thanos-stack.podHardening" (dict "ctx" . "component" "tenant-gateway") | nindent 6 }}
      containers:
        - name: nginx
          image: {{ $g.image }}
          securityContext:
            {{- include "thanos-stack.containerSecurityContext" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          {{- with $g.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
            {{- if and (eq ($g.auth.method | default "basic") "basic") $g.auth.existingSecret }}
            - { name: htpasswd, mountPath: /etc/nginx/auth, readOnly: true }
            {{- end }}
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: {{ $fn }}-tenant-gateway
        {{- if and (eq ($g.auth.method | default "basic") "basic") $g.auth.existingSecret }}
        - name: htpasswd
          secret:
            secretName: {{ $g.auth.existingSecret }}
        {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-tenant-gateway
  labels:
    {{- include "thanos-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-gateway
spec:
  selector:
    {{- include "thanos-stack.selectorLabels" (dict "ctx" . "component" "tenant-gateway") | nindent 4 }}
  ports:
    - { name: http, port: 10902, targetPort: http }
{{- if gt (int ($g.replicas | default 2)) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fn }}-tenant-gateway
  labels:
    {{- include "thanos-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-gateway
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "thanos-stack.selectorLabels" (dict "ctx" . "component" "tenant-gateway") | nindent 6 }}
{{- end }}
{{- end }}
