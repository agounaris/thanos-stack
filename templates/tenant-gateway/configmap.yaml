{{- $mt := .Values.multiTenancy -}}
{{- if and $mt.enabled $mt.gateway.enabled -}}
{{- $fn := include "thanos-stack.fullname" . -}}
{{- $hdr := $mt.tenantHeader -}}
{{- $method := $mt.gateway.auth.method | default "basic" -}}
{{- $idVar := ternary (printf "http_%s" ($mt.gateway.auth.mtlsCNHeader | replace "-" "_" | lower)) "remote_user" (eq $method "mtls") -}}
{{- if eq $method "none" }}{{ $idVar = printf "http_%s" ($hdr | replace "-" "_" | lower) }}{{ end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-tenant-gateway
  labels:
    {{- include "thanos-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-gateway
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;

      # authenticated identity -> tenant. Unknown identity -> "" -> refused.
      map ${{ $idVar }} $tenant {
        default "";
        {{- range $t := $mt.tenants }}
        {{- $user := $t.name }}
        {{- range $u, $mapped := $mt.gateway.auth.userToTenant }}{{ if eq $mapped $t.name }}{{ $user = $u }}{{ end }}{{ end }}
        {{ $user | quote }} {{ $t.name | quote }};
        {{- end }}
      }

      upstream query_frontend {
        server {{ $fn }}-query-frontend.{{ .Release.Namespace }}.svc.cluster.local:10902;
      }

      server {
        listen 8080;
        server_name _;

        location = /healthz { auth_basic off; return 200 "ok\n"; }

        location / {
          {{- if eq $method "basic" }}
          auth_basic "thanos";
          auth_basic_user_file /etc/nginx/auth/htpasswd;
          {{- end }}
          {{- if eq $mt.onMissingTenant "reject" }}
          # runs AFTER auth (access phase): identity is known, tenant is resolved
          auth_request /_tenant_gate;
          error_page 403 = @bad_tenant;
          {{- end }}
          proxy_http_version 1.1;
          # a client can never set its own tenant — this wins over any inbound header
          proxy_set_header {{ $hdr }} $tenant;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_read_timeout 300s;
          proxy_pass http://query_frontend;
        }

        location = /_tenant_gate {
          internal;
          if ($tenant = "") { return 403; }
          return 204;
        }
        location @bad_tenant { return 400 "missing or unknown tenant\n"; }
      }
    }
{{- end }}
